# =============================================================================
# panel profile — workload deltas only.
#
# Control-plane host (panel, bots, monitoring, websites). Everything
# size-dependent is computed per host and lives in common.base.conf; this file
# holds only the values that differ because of workload.
#
# The panel keeps long-lived outbound sessions open (node polling, Telegram,
# GitHub, ACME) and those get evicted mid-flight by the vpn profile's aggressive
# conntrack timeouts, so the timeouts here are relaxed. IPv6 is left enabled.
# =============================================================================

# =============================================================================
# CONNTRACK TIMEOUTS — relaxed for panel workloads
# =============================================================================
net.netfilter.nf_conntrack_tcp_timeout_established = 7200
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_last_ack = 15
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close = 10
net.netfilter.nf_conntrack_tcp_timeout_max_retrans = 120
net.netfilter.nf_conntrack_tcp_timeout_unacknowledged = 120
net.netfilter.nf_conntrack_udp_timeout = 60
net.netfilter.nf_conntrack_udp_timeout_stream = 120
net.netfilter.nf_conntrack_icmp_timeout = 30
net.netfilter.nf_conntrack_generic_timeout = 120

# =============================================================================
# TIME-WAIT / ORPHANS
# =============================================================================
net.ipv4.tcp_orphan_retries = 3
net.ipv4.tcp_fin_timeout = 30

# =============================================================================
# TCP FAST OPEN
# =============================================================================
# Client-side only on the panel: it makes outbound requests (nodes, Telegram,
# GitHub, ACME) but terminates no VPN clients, so server-side TFO buys nothing.
net.ipv4.tcp_fastopen = 1
