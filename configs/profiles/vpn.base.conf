# =============================================================================
# vpn profile — workload deltas only.
#
# High-traffic relay node terminating client tunnels. Everything size-dependent
# (buffers, conntrack_max, FD limits, queues) is computed per host and lives in
# common.base.conf — this file holds only the values that differ because of what
# the machine DOES, not how big it is.
#
# Rationale for the split: a VPN node wants short conntrack timeouts so flood
# residue is culled fast, while the panel's own long-lived outbound sessions
# (node polling, Telegram, GitHub) get evicted mid-flight by those same values.
# =============================================================================

# --- Disable IPv6 ---
# Намерение: на VPN-нодах IPv6 не используется.
#
# Обе строки работают только там, где адресацией не владеет кто-то ещё. Если
# netplan провайдера назначает интерфейсу статический IPv6-адрес и маршрут (а на
# части хостингов это так), systemd-networkd выставит на нём disable_ipv6=0 уже
# после применения sysctl, и интерфейс останется с рабочим IPv6. Это ожидаемо и
# не считается ошибкой: адресацией владеет netplan, а не файл тюнинга. Если IPv6
# нужно выключить по-настоящему — убирать адрес и маршрут в netplan.
# Следствие: verify не проверяет эти ключи (иначе был бы вечный ложный отказ —
# их же переписывает в рантайме WireGuard-аутбаунд Xray).
#
# Строки для lo здесь нет намеренно: петля снаружи недостижима, выключение на ней
# ничего не даёт, но ломает всё, что слушает [::1].
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1

# =============================================================================
# CONNTRACK TIMEOUTS — aggressive cleanup
# =============================================================================
# 1800 was only safe by coincidence: it works while Xray's connIdle stays at its
# 300 s default. Raise connIdle (a common stability tweak) or add an inbound
# whose client legitimately idles, and the entry expires - then tcp_loose=0 marks
# the next mid-stream packet INVALID and UFW drops it, so the tunnel dies
# silently at exactly the 30-minute mark. The RAM-scaled conntrack_max absorbs
# the doubled residency.
net.netfilter.nf_conntrack_tcp_timeout_established = 3600
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 10
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 10
net.netfilter.nf_conntrack_tcp_timeout_last_ack = 10
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 10
net.netfilter.nf_conntrack_tcp_timeout_close = 5
net.netfilter.nf_conntrack_tcp_timeout_max_retrans = 60
net.netfilter.nf_conntrack_tcp_timeout_unacknowledged = 60
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 60
net.netfilter.nf_conntrack_icmp_timeout = 10
net.netfilter.nf_conntrack_generic_timeout = 60

# =============================================================================
# TIME-WAIT / ORPHANS — fast reclaim
# =============================================================================
net.ipv4.tcp_orphan_retries = 1
net.ipv4.tcp_fin_timeout = 15

# =============================================================================
# IP FORWARDING
# =============================================================================
# Required for tun/TPROXY forwarding on a relay node. Deliberately absent from
# the panel profile: a panel is not a router, and ip_forward=1 also changes the
# per-interface send_redirects/accept_redirects semantics. Docker sets it to 1
# itself for its bridge, so the panel simply stops asserting it.
net.ipv4.ip_forward = 1

# =============================================================================
# TCP FAST OPEN
# =============================================================================
# 3 = client + server. Xray arms TCP_FASTOPEN on the listener when an inbound
# sets "tcpFastOpen", but with the kernel gate at 1 (client only) the setsockopt
# SUCCEEDS and the kernel then ignores it - so inbound TFO was silently inert.
# The spoofed-data-in-SYN concern is handled by the TFO cookie: without a valid
# cookie for that source the kernel falls back to a normal handshake.
# Note TFO cannot coexist with SYNPROXY; that is acceptable because SYNPROXY is
# emergency-only, and the watchdog logs when it engages.
net.ipv4.tcp_fastopen = 3
