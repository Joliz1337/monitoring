# =============================================================================
# Shared kernel tuning — profile-independent.
#
# @@TOKEN@@ values are computed per host by tune-sysctl.sh from MemTotal/nproc.
# See /opt/monitoring/configs/tuning-facts.json for what this host resolved to
# and why. Never edit the rendered /etc/sysctl.d/99-vless-tuning.conf directly:
# put operator overrides in /opt/monitoring/configs/local-overrides.conf, which
# is appended last and therefore wins.
#
# A key must live in EXACTLY ONE of common.base.conf / <profile>.base.conf —
# the renderer refuses to build if a key appears in both, because sysctl takes
# the last occurrence and the result would depend on file order.
# =============================================================================

# --- BBR + fq ---
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq
# Makes the line above fail LOUDLY at apply time if bbr is not loadable, instead
# of silently leaving the host on cubic. tcp_bbr is force-loaded via
# /etc/modules-load.d/mon-tuning.conf.
net.ipv4.tcp_allowed_congestion_control = bbr cubic

# =============================================================================
# FILE DESCRIPTORS
# =============================================================================
# One number for the whole chain: fs.nr_open is the kernel's hard ceiling for
# any setrlimit(RLIMIT_NOFILE), so limits.conf/systemd/Docker/HAProxy all derive
# from it. A limits.conf value above nr_open makes PAM fail and can break login.
fs.file-max = @@FD_MAX@@
fs.nr_open = @@FD_MAX@@

# =============================================================================
# CONNTRACK
# =============================================================================
# Sized from RAM: ~196 entries/MB, i.e. ~6% of RAM at 320 B per nf_conn. That is
# a worst-case-under-attack ceiling, not a steady allocation. hashsize is
# conntrack_max/4 (avg chain length 4) and is set via /etc/modprobe.d.
net.netfilter.nf_conntrack_max = @@CONNTRACK_MAX@@

# Strict TCP tracking. With loose=1 any mid-stream ACK creates a conntrack
# entry, so an ACK flood fills the table with garbage records that have no
# real socket behind them (observed: 262k table full at ~294k pps while real
# TCP was ~19k). Nodes terminate traffic locally, there is no asymmetric
# routing, so strict mode is safe.
net.netfilter.nf_conntrack_tcp_loose = 0
# be_liberal=1 is the single highest-value stability fix here. With 0 the kernel
# marks routine out-of-window ACKs - ordinary SACK, reordering and retransmits on
# a lossy mobile path behind GRO - as INVALID, and UFW's own INVALID -j DROP then
# drops them. That is the "tunnel randomly stalls" class of bug. It is a
# different knob from tcp_loose above: tcp_loose=0 is what defeats ACK floods
# (an unsolicited mid-stream ACK cannot create an entry) and stays 0.
net.netfilter.nf_conntrack_tcp_be_liberal = 1

# NIC hardware already verified checksums — skip re-verification in conntrack
net.netfilter.nf_conntrack_checksum = 0
# Never log invalid packets: during floods this drowns dmesg/journald
net.netfilter.nf_conntrack_log_invalid = 0

# Short SYN timeouts: spoofed-SYN entries get flushed before they accumulate
net.netfilter.nf_conntrack_tcp_timeout_syn_sent = 15
net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 10

# =============================================================================
# SOCKET BUFFERS
# =============================================================================
# Xray never calls SO_SNDBUF/SO_RCVBUF (verified: zero occurrences in its
# source), so kernel autotuning is the ONLY thing that governs throughput and
# these ceilings are load-bearing. Hysteria2/QUIC and XHTTP-h3 use an 8 MiB
# stream / 20 MiB connection receive window, so rmem_max must comfortably
# exceed what quic-go asks for or it degrades and logs a warning.
net.core.rmem_default = @@SOCK_DEFAULT@@
net.core.wmem_default = @@SOCK_DEFAULT@@
net.core.rmem_max = @@SOCK_MAX@@
net.core.wmem_max = @@SOCK_MAX@@
net.core.optmem_max = 81920

# min / default / max
net.ipv4.tcp_rmem = @@TCP_RMEM@@
net.ipv4.tcp_wmem = @@TCP_WMEM@@

# Per-socket floor that survives udp_mem pressure. A flat large value here is an
# udp_mem bypass of N_sockets x floor, so it scales with RAM.
net.ipv4.udp_rmem_min = @@UDP_MIN@@
net.ipv4.udp_wmem_min = @@UDP_MIN@@

# Global socket memory budget in PAGES (low / pressure / high). tcp high + udp
# high together stay at ~25% of RAM, leaving room for Xray, Docker, HAProxy,
# nginx and the agent. These live in the file rather than being applied
# transiently, because any `sysctl --system` (cloud-init, a package postinst)
# silently reverts transient values to kernel defaults mid-flight.
net.ipv4.tcp_mem = @@TCP_MEM@@
net.ipv4.udp_mem = @@UDP_MEM@@

# =============================================================================
# CONNECTION QUEUES
# =============================================================================
# Accept-queue depth tracks drain rate (CPUs); syncookies are the overflow valve.
net.core.somaxconn = @@SOMAXCONN@@
net.ipv4.tcp_max_syn_backlog = @@TCP_MAX_SYN_BACKLOG@@
# PER CPU — the aggregate is this times nproc, so it scales down with core count.
# Depth beyond one softirq budget is pure bufferbloat; netdev_budget is the drain.
net.core.netdev_max_backlog = @@NETDEV_MAX_BACKLOG@@
net.core.netdev_budget = @@NETDEV_BUDGET@@
net.core.netdev_budget_usecs = @@NETDEV_BUDGET_USECS@@
# Required companion to the backlog under RPS: without it a single flood flow
# can occupy an entire per-CPU backlog queue.
net.core.flow_limit_table_len = @@FLOW_LIMIT_TABLE_LEN@@

# =============================================================================
# TCP PERFORMANCE
# =============================================================================
# tcp_fastopen is profile-specific (see <profile>.base.conf).
# The blackhole heuristic disables TFO fleet-wide for an hour after a single
# blackholed attempt on one path, which makes the feature unreliable rather than
# safe; 0 turns that off.
net.ipv4.tcp_fastopen_blackhole_timeout_sec = 0
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.tcp_adv_win_scale = 1
net.ipv4.tcp_ecn = 0
net.ipv4.tcp_frto = 2
net.ipv4.tcp_notsent_lowat = @@TCP_NOTSENT_LOWAT@@
# Autocorking coalesces small writes while the previous skb is still queued.
# Measured on a live relay: without it the average TX skb was 1243 B — exactly one
# segment, i.e. a TCP-mode proxy does NOT batch on its own, and every write cost a
# separate virtio kick (0.53 per packet). Turning it on cut that by ~19%.
net.ipv4.tcp_autocorking = 1
# On listener close/replace (an Xray restart, a HAProxy reload) migrate the
# already-queued request sockets instead of dropping them. Kernel >= 5.14, so
# absent on 20.04 - the renderer records it in unsupported_keys there and
# verification skips it.
net.ipv4.tcp_migrate_req = 1

# =============================================================================
# TCP RETRIES
# =============================================================================
# 8 retries is ~51 s of RTO backoff before the socket is destroyed, against
# Xray's own 300 s connIdle - so the kernel was the aggressor for any mobile
# client that lost signal for a minute. 10 is ~100-120 s; the kernel default 15
# is ~15 minutes.
net.ipv4.tcp_retries2 = 10
net.ipv4.tcp_syn_retries = 3
net.ipv4.tcp_synack_retries = 2

# =============================================================================
# TIME-WAIT
# =============================================================================
net.ipv4.tcp_max_tw_buckets = @@TCP_MAX_TW_BUCKETS@@
net.ipv4.ip_local_port_range = 9101 65535
# Timestamps ON, and it matters in three independent ways:
#   1. tcp_tw_reuse below is a complete no-op without them - the kernel needs the
#      TS value to tell an old segment from a new one. The old config set
#      tw_reuse=1 and timestamps=0 two lines apart.
#   2. A connection established via syncookies has nowhere to store the
#      negotiated options, so the kernel encodes wscale/SACK/ECN IN the
#      timestamp. With timestamps off, every connection that completes during a
#      SYN flood loses window scaling (64 KiB cap) and SACK - exactly when it
#      hurts most.
#   3. SYNPROXY needs them for the same reason (it passes --timestamp).
# The historic "22M PAWS rejections for NAT'd clients" was tcp_tw_recycle, which
# was removed from the kernel in 4.12; per-host randomised timestamp offsets
# since 4.10 eliminated that failure mode. Ubuntu 22.04 is 5.15, 24.04 is 6.8.
# If PAWSEstab does start climbing (nstat -az | grep -i paws), override it in
# local-overrides.conf - no redeploy needed.
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_tw_reuse = 1

# =============================================================================
# ORPHANED CONNECTIONS
# =============================================================================
net.ipv4.tcp_max_orphans = @@TCP_MAX_ORPHANS@@

# =============================================================================
# KEEPALIVE
# =============================================================================
# NOTE: these do NOT apply to Xray's accepted client sockets. Xray only enables
# SO_KEEPALIVE when sockopt.tcpKeepAliveIdle/Interval are set in the inbound
# config, and they default to 0 — so a client that vanishes without a FIN and
# with nothing queued leaves an ESTABLISHED socket the kernel will never reap;
# only Xray's own connIdle (300s) closes it. These values do protect sshd and
# anything else that enables keepalive itself.
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_keepalive_intvl = 15

# =============================================================================
# ANTI-DDOS: SYN FLOOD PROTECTION
# =============================================================================
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
# Respond to out-of-window/junk packets at most every 500ms per socket —
# don't burn CPU and egress answering flood traffic
net.ipv4.tcp_invalid_ratelimit = 500
# CVE-2016-5696: remove the global challenge-ACK rate limit, which leaked a side
# channel for off-path TCP sequence inference.
net.ipv4.tcp_challenge_ack_limit = 999999999

# =============================================================================
# REVERSE PATH FILTER - LOOSE MODE
# =============================================================================
# Note: the redirect/ICMP/source-route hardening below restates current kernel
# defaults on purpose - they are free and guard against a distro changing one.
# Lines that were pure default AND carried no security value were removed
# (tcp_sack, tcp_dsack, tcp_window_scaling, tcp_moderate_rcvbuf, tcp_retries1,
# tcp_abort_on_overflow, log_martians, route.gc_timeout - a no-op since Linux 3.6
# removed the route cache - tcp_ecn_fallback, meaningless while tcp_ecn=0, and
# the three vm.overcommit/panic_on_oom keys). 12 lines of noise is what let the
# timestamps/tw_reuse contradiction sit two lines apart unnoticed.
# Loose mode is compatible with a WireGuard tun holding AllowedIPs 0.0.0.0/0.
# Xray's WireGuard outbound writes all/rp_filter=0 at runtime and the next
# sysctl -p restores 2, so the two writers ping-pong; this key is therefore
# excluded from verification.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# =============================================================================
# ICMP PROTECTION
# =============================================================================
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.icmp_echo_ignore_all = 0
net.ipv4.icmp_ratelimit = 1000
net.ipv4.icmp_ratemask = 6168

# =============================================================================
# REDIRECT PROTECTION
# =============================================================================
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# =============================================================================
# ARP CACHE
# =============================================================================
net.ipv4.neigh.default.gc_thresh1 = 1024
net.ipv4.neigh.default.gc_thresh2 = 2048
net.ipv4.neigh.default.gc_thresh3 = 4096
net.ipv4.neigh.default.gc_stale_time = 60
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_announce = 2
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.default.arp_ignore = 1

# =============================================================================
# MEMORY
# =============================================================================
vm.swappiness = 10
# Scaled down on large hosts: 20% of 248 GB is 49 GB of dirty pages before
# writers block, which is a real stall source.
vm.dirty_ratio = @@DIRTY_RATIO@@
vm.dirty_background_ratio = @@DIRTY_BACKGROUND_RATIO@@
# GFP_ATOMIC reserve for driver allocations in IRQ context. Kept under ~2% of
# RAM: it also raises the reclaim watermarks.
vm.min_free_kbytes = @@MIN_FREE_KBYTES@@

# =============================================================================
# KERNEL
# =============================================================================
kernel.pid_max = 4194304
kernel.panic = 10
# Don't let flood-triggered kernel messages drown journald
kernel.printk_ratelimit = 5
kernel.printk_ratelimit_burst = 10

# =============================================================================
# RPS/RFS GLOBAL SETTING
# =============================================================================
# Single owner: this file. The NIC tune scripts used to recompute it as
# nproc*32768 and overwrite the value at boot, and their result was also not a
# power of two once divided by the queue count, which silently disabled RFS on
# high-queue NICs. They now only write the per-queue rps_cpus/rps_flow_cnt,
# deriving flow_cnt as pow2_floor(this / rx_queues).
net.core.rps_sock_flow_entries = @@RPS_SOCK_FLOW_ENTRIES@@
