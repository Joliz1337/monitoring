services:
  postgres:
    image: postgres:16-alpine
    container_name: panel-postgres
    restart: unless-stopped
    # max_connections поднят выше потолка пула бэкенда (pool_size 40 + max_overflow 80 = 120),
    # чтобы фоновые синки не упирались в "too many clients already" при fan-out по нодам.
    #
    # Размеры памяти считаются от RAM конкретного хоста при установке/обновлении
    # (deploy.sh и scripts/apply-update.sh кладут их в .env). Значения по умолчанию
    # здесь — потолок для VPS на 2 ГБ: этот файл перезаписывается при каждом
    # обновлении у всех, и слишком жадный shared_buffers не дал бы postgres стартовать.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-512MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:-1GB}
      - -c
      - checkpoint_completion_target=0.9
      # Метрики пишутся каждые 10 секунд, таблицы истории постоянно в мусоре:
      # дефолтные пороги (20% таблицы, naptime 60s) пускают автовакуум слишком
      # поздно, а дефолтный cost_limit растягивает его на часы
      - -c
      - autovacuum_naptime=30s
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
      - -c
      - autovacuum_vacuum_cost_limit=1000
    # Параллельные запросы берут рабочую память из /dev/shm, а Docker по умолчанию
    # даёт контейнеру только 64 МБ — этого не хватает при поднятом work_mem
    shm_size: 256mb
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-panel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-panel_secret}
      - POSTGRES_DB=${POSTGRES_DB:-panel}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - panel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panel} -d ${POSTGRES_DB:-panel}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: panel-nginx
    restart: unless-stopped
    ports:
      - "${PANEL_PORT:-443}:443"
      - "${PANEL_HTTP_PORT:-80}:80"
    volumes:
      # Монтируем шаблон: официальный nginx-entrypoint сам прогоняет envsubst
      # и кладёт результат в /etc/nginx/nginx.conf при каждом старте контейнера —
      # конфиг всегда свежий после обновления, ручная регенерация не нужна
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - DOMAIN=${DOMAIN}
      - PANEL_UID=${PANEL_UID}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - panel-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/joliz1337/monitoring-panel-frontend:${MON_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - CACHE_BUST=${CACHE_BUST:-}
    container_name: panel-frontend
    restart: unless-stopped
    environment:
      - EXT_KEY=${EXT_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - panel-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/joliz1337/monitoring-panel-backend:${MON_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - CACHE_BUST=${CACHE_BUST:-}
    container_name: panel-backend
    restart: unless-stopped
    # Root access for docker.sock and Let's Encrypt certificate reading (0600 perms)
    user: root
    environment:
      - PANEL_UID=${PANEL_UID}
      - PANEL_PASSWORD=${PANEL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-1440}
      - MAX_FAILED_ATTEMPTS=${MAX_FAILED_ATTEMPTS:-5}
      - BAN_DURATION_SECONDS=${BAN_DURATION_SECONDS:-900}
      # PostgreSQL settings
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-panel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-panel_secret}
      - POSTGRES_DB=${POSTGRES_DB:-panel}
      - DOMAIN=${DOMAIN}
      - EXT_KEY=${EXT_KEY:-}
      - PANEL_ENC_KEY=${PANEL_ENC_KEY:-}
    volumes:
      - panel-data:/app/data
      # For update/renew scripts: access to project directory and docker
      - /opt/monitoring-panel:/opt/monitoring-panel
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      # For SSL certificate management (certbot needs write access for wildcard cert issuance)
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - panel-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  panel-data:
  postgres-data:

networks:
  panel-network:
    driver: bridge
