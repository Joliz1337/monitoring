name: Build & Publish Docker Images

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # main → :latest (стабильный канал), dev → :dev
  IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Матрица рендерера — чистый bash, Python-окружение ей не нужно,
      # факты хоста подменяются через MON_FACT_*, выходы уходят в MON_RENDER_ROOT
      - name: Configs renderer matrix
        run: bash configs/tests/render-matrix.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # как в node/Dockerfile
          cache: pip
          cache-dependency-path: node/requirements.txt

      # Сами тесты — голый unittest, но модули под тестом импортируют
      # fastapi/pydantic/docker/cryptography, поэтому рантайм агента нужен целиком
      - name: Install node agent dependencies
        run: pip install -r node/requirements.txt

      - name: Node tests
        working-directory: node
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # как в panel/backend/Dockerfile

      # Генератор nginx-конфига обходится стандартной библиотекой, так что
      # requirements панели (certbot, grpcio, asyncssh) здесь не ставятся
      - name: Panel backend tests
        working-directory: panel/backend
        run: python -m unittest discover -s tests -p "test_*.py" -v

  node-api:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./node
          file: ./node/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/joliz1337/monitoring-node-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=node-api
          cache-to: type=gha,mode=max,scope=node-api

  panel-frontend:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./panel/frontend
          file: ./panel/frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/joliz1337/monitoring-panel-frontend:${{ env.IMAGE_TAG }}
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=panel-frontend
          cache-to: type=gha,mode=max,scope=panel-frontend

  panel-backend:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./panel
          file: ./panel/backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/joliz1337/monitoring-panel-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=panel-backend
          cache-to: type=gha,mode=max,scope=panel-backend
